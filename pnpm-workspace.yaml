packages:
  - apps/*
  - docs
  - packages/*
  - vendor/rendercv-toolkit/packages/*
  # Its `prepare` script builds dist/ on install, at this fixed path. Tourkit must
  # not be installed as a git dependency: pnpm then builds it inside its store,
  # and CI's store sits under node_modules, which changes what it compiles to.
  - vendor/tourkit
